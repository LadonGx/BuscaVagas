<!doctype html>
<html lang="pt-BR" data-theme="escuro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>BuscaVagas</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Aplica o tema salvo antes do React montar, para a tela não piscar.
      Mesma chave e valores de src/lib/theme.ts.
    -->
    <script>
      (function () {
        var theme = 'escuro';
        try {
          if (localStorage.getItem('busca-vagas:tema') === 'claro') theme = 'claro';
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
