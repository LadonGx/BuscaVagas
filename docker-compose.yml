name: busca-vagas

services:
  postgres:
    image: postgres:17-alpine
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buscavagas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buscavagas}
      POSTGRES_DB: ${POSTGRES_DB:-buscavagas}
    # Só na interface local. Sem o "127.0.0.1:", o Docker publica em 0.0.0.0
    # e qualquer um na mesma rede alcança o banco com a senha padrão.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-buscavagas} -d ${POSTGRES_DB:-buscavagas}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: no
    # appendonly: a fila sobrevive a um restart do container.
    # noeviction: exigido pelo BullMQ — o Redis nunca pode descartar chaves de job.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
